name: CD

# Phase 11 - Continuous Delivery (adapter for hello-service).
# Implements blueprint/11-continuous-delivery.md + ADR-009 (OCI + Podman) + ADR-010 (Quay.io).
#
# Two dispatch modes:
#   1. Publish and deploy: validated commit -> CI gates -> OCI image -> Quay.io -> digest
#      (immutable identity) -> deploy by digest -> smoke GET /api/hello.
#   2. Digest deployment: deploy an existing sha256 digest without rebuilding or republishing.
#      This is the promotion/rollback path; the digest is the immutable identity.
#
# Automatic publication on push to main is disabled after the post-closure incident
# documented in blueprint/changes/p11-remote-publication.md. Publication now requires an
# explicit workflow_dispatch on the commit to publish.
#
# Release controls:
#   - The job runs in the selected GitHub environment (`staging` or `production`), both
#     restricted to `main`.
#   - A release tag that already exists in Quay is refused unless the dispatcher sets
#     allow_republish=true. The Git tag namespace is protected by a repository ruleset.
#
# ADR-010 authentication:
#   1) Preferred  : OIDC/keyless via Quay robot-account federation (GitHub OIDC issuer).
#   2) Alternative: Quay robot account/token stored exclusively as GitHub Actions Secrets.
# Digest deployments do not need registry write credentials; the registry repository is public.
# The job fails fast with an explicit message if the external prerequisites are missing
# (see "External prerequisites" in blueprint/11-continuous-delivery.md).

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment target (GitHub environment)"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_digest:
        description: "Existing sha256 digest to deploy (promotion/rollback; skips build and publish)"
        required: false
        default: ""
        type: string
      allow_republish:
        description: "Overwrite an existing release tag (intentional correction only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target_environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      REQUESTED_DIGEST: ${{ inputs.image_digest }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.resolve_digest.outputs.image }}
      digest: ${{ steps.resolve_digest.outputs.digest }}
      target_environment: ${{ inputs.target_environment }}

    steps:
      - name: Checkout commit under delivery
        uses: actions/checkout@v4

      - name: Set up Java 21
        if: ${{ inputs.image_digest == '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (project wrapper)
        if: ${{ inputs.image_digest == '' }}
        uses: gradle/actions/setup-gradle@v4

      - name: External prerequisites (fail fast with explicit message)
        id: prereq
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
          QUAY_AUTH: ${{ vars.QUAY_AUTH }}
          QUAY_ROBOT_USERNAME: ${{ vars.QUAY_ROBOT_USERNAME }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -eu -o pipefail
          if [[ -z "${QUAY_NAMESPACE}" ]]; then
            echo "::error::BLOCKED - external configuration: GitHub repository variable 'QUAY_NAMESPACE' is not set (Quay.io namespace/org, e.g. 'jorvacode')."
            echo "::error::Create first the PUBLIC repo '${QUAY_NAMESPACE:-<ns>}/hello-service' in Quay.io and grant write to the robot account."
            exit 1
          fi
          if [[ -n "${REQUESTED_DIGEST}" ]]; then
            if [[ ! "${REQUESTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::image_digest must match ^sha256:[0-9a-f]{64}$ (got '${REQUESTED_DIGEST}')."
              exit 1
            fi
            echo "mode=digest" >> "$GITHUB_OUTPUT"
            echo "Digest deployment mode - registry write credentials are not required."
          else
            MODE="${QUAY_AUTH:-oidc}"
            echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
            if [[ "${MODE}" == "oidc" ]]; then
              if [[ -z "${QUAY_ROBOT_USERNAME}" ]]; then
                echo "::error::BLOCKED - external configuration: OIDC selected (preferred per ADR-010) but variable 'QUAY_ROBOT_USERNAME' is not set."
                echo "::error::Set it to the federated robot (e.g. 'jorvacode+github_actions') and configure robot federation to THIS repo/sha subject in Quay.io."
                exit 1
              fi
            elif [[ "${MODE}" == "robot" ]]; then
              if [[ -z "${QUAY_USERNAME}" || -z "${QUAY_TOKEN}" ]]; then
                echo "::error::BLOCKED - external configuration: robot alternative selected but GitHub Secrets 'QUAY_USERNAME'/'QUAY_TOKEN' are missing."
                exit 1
              fi
            else
              echo "::error::Unknown QUAY_AUTH mode '${MODE}'. Supported: 'oidc' | 'robot'."
              exit 1
            fi
            echo "Prerequisites OK - auth-mode=${MODE} namespace=${QUAY_NAMESPACE}"
          fi

      - name: Phase 09 validation gates (compile + tests + build)
        if: ${{ inputs.image_digest == '' }}
        run: ./gradlew clean build --no-daemon --console=plain

      - name: "Resolve release version (reproducible source: Gradle project version)"
        if: ${{ inputs.image_digest == '' }}
        id: version
        run: |
          set -eu -o pipefail
          VERSION=$(./gradlew -q properties --no-daemon --console=plain | awk -F': ' '/^version:/{print $2; exit}')
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not resolve project version from Gradle."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}"

      - name: Set up Podman runtime (OCI, ADR-009)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Authenticate Quay.io (OIDC keyless preferred / robot secret fallback)
        if: ${{ inputs.image_digest == '' }}
        env:
          AUTH_MODE: ${{ steps.prereq.outputs.mode }}
          QUAY_ROBOT_USERNAME: ${{ vars.QUAY_ROBOT_USERNAME }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -eu -o pipefail
          if [[ "${AUTH_MODE}" == "oidc" ]]; then
            OIDC_TOKEN=$(curl -sSf \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              -H "Accept: application/json" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
            echo "::add-mask::${OIDC_TOKEN}"
            QUAY_ROBOT_TOKEN=$(curl -sSf \
              "https://quay.io/oauth2/federation/robot/token" \
              -u "${QUAY_ROBOT_USERNAME}:${OIDC_TOKEN}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
            echo "::add-mask::${QUAY_ROBOT_TOKEN}"
            echo "${QUAY_ROBOT_TOKEN}" | podman login quay.io -u "${QUAY_ROBOT_USERNAME}" --password-stdin
          else
            echo "${QUAY_TOKEN}" | podman login quay.io -u "${QUAY_USERNAME}" --password-stdin
          fi
          podman login --get-login quay.io

      - name: Enforce immutable release tag
        if: ${{ inputs.image_digest == '' }}
        id: immutability
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
          ALLOW_REPUBLISH: ${{ inputs.allow_republish }}
        run: |
          set -eu -o pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${ALLOW_REPUBLISH:-false}" == "true" ]]; then
            echo "::warning::allow_republish=true; the release tag ${VERSION} may be overwritten by operator decision."
            exit 0
          fi
          API="https://quay.io/api/v1/repository/${QUAY_NAMESPACE}/hello-service/tag/?specificTag=${VERSION}"
          STATUS=$(curl -sS -o /tmp/quay-tags.json -w "%{http_code}" "${API}")
          if [[ "${STATUS}" == "404" ]]; then
            echo "Release tag ${VERSION} does not exist yet; publication may proceed."
            exit 0
          fi
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Could not verify release tag ${VERSION} (HTTP ${STATUS}). Refusing to publish."
            exit 1
          fi
          COUNT=$(jq -r '.tags | length' /tmp/quay-tags.json)
          if [[ "${COUNT}" != "0" ]]; then
            echo "::error::Release tag ${VERSION} already exists in Quay. Refusing to overwrite an immutable release tag; bump the version or dispatch with allow_republish=true for an intentional correction."
            exit 1
          fi
          echo "Release tag ${VERSION} is not present; publication may proceed."

      - name: Build OCI image (Phase 10 artifact + provenance labels)
        if: ${{ inputs.image_digest == '' }}
        id: build
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
        run: |
          set -eu -o pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="quay.io/${QUAY_NAMESPACE}/hello-service:${VERSION}"
          podman build \
            --build-arg APP_VERSION="${VERSION}" \
            --build-arg CI_REPOSITORY="${{ github.repository }}" \
            --build-arg CI_SHA="${{ github.sha }}" \
            -t "${IMAGE}" \
            -f Dockerfile \
            .
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Publish to Quay.io and record immutable digest
        if: ${{ inputs.image_digest == '' }}
        id: publish
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
        run: |
          set -eu -o pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="quay.io/${QUAY_NAMESPACE}/hello-service:${VERSION}"
          mkdir -p build
          podman push --digestfile build/hello-service.digest "${IMAGE}"
          if [[ ! -s build/hello-service.digest ]]; then
            echo "::error::podman push --digestfile did not write a digest file."
            exit 1
          fi
          DIGEST=$(head -n 1 build/hello-service.digest)
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest format: ${DIGEST}"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}@${DIGEST}"

      - name: Resolve deployment digest (published or requested)
        id: resolve_digest
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -eu -o pipefail
          if [[ -n "${REQUESTED_DIGEST}" ]]; then
            DIGEST="${REQUESTED_DIGEST}"
            MODE="digest"
          else
            DIGEST="${PUBLISHED_DIGEST}"
            MODE="publish"
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Deployment digest must match ^sha256:[0-9a-f]{64}$ (got '${DIGEST}')."
            exit 1
          fi
          IMAGE_REF="quay.io/${QUAY_NAMESPACE}/hello-service@${DIGEST}"
          mkdir -p build
          echo "${IMAGE_REF}" > build/image-digest.txt
          {
            echo "digest=${DIGEST}"
            echo "image=${IMAGE_REF}"
            echo "mode=${MODE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ${MODE} deployment: ${IMAGE_REF}"

      - name: Upload digest artifact (traceability)
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: build/image-digest.txt

      - name: Deploy by digest to target environment (no rebuild)
        env:
          DEPLOY_DIGEST: ${{ steps.resolve_digest.outputs.digest }}
          DEPLOY_IMAGE: ${{ steps.resolve_digest.outputs.image }}
        run: |
          set -eu -o pipefail
          podman rm -f hello-service-cd >/dev/null 2>&1 || true
          podman run -d --name hello-service-cd -p 8080:8080 "${DEPLOY_IMAGE}"
          echo "Started ${DEPLOY_IMAGE} in target environment ${TARGET_ENVIRONMENT}; readiness and function are asserted by the smoke test."

      - name: "Smoke test GET /api/hello (functional evidence: 200, text/plain, Hello, World!)"
        run: |
          set -eu -o pipefail
          READY=false
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/api/hello >/dev/null 2>&1; then
              echo "READY (iteration ${i})"
              READY=true
              break
            fi
            sleep 5
          done
          test "${READY}" = "true"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/hello)
          CT=$(curl -sS -o /dev/null -w "%{content_type}" http://127.0.0.1:8080/api/hello)
          BODY=$(curl -fsS http://127.0.0.1:8080/api/hello)
          test "${CODE}" = "200"
          case "${CT}" in
            text/plain*) ;;
            *) echo "::error::Unexpected Content-Type: ${CT}"; exit 1 ;;
          esac
          test "${BODY}" = "Hello, World!"
          echo "SMOKE_OK target=${TARGET_ENVIRONMENT} code=${CODE} content-type=${CT} body=${BODY}"

      - name: Record deployment and promotion path (same digest, no podman build)
        id: promote
        env:
          DEPLOY_DIGEST: ${{ steps.resolve_digest.outputs.digest }}
          DEPLOY_IMAGE: ${{ steps.resolve_digest.outputs.image }}
        run: |
          set -eu -o pipefail
          echo "Target environment: ${TARGET_ENVIRONMENT}"
          echo "Digest: ${DEPLOY_DIGEST}"
          echo "Image: ${DEPLOY_IMAGE}"
          echo "image-ref=${DEPLOY_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DEPLOY_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: CD summary
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
          DEPLOY_DIGEST: ${{ steps.resolve_digest.outputs.digest }}
          DEPLOY_IMAGE: ${{ steps.resolve_digest.outputs.image }}
          DEPLOY_MODE: ${{ steps.resolve_digest.outputs.mode }}
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          set -eu -o pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ -n "${VERSION}" ]]; then
            VERSION_DISPLAY="${VERSION}"
          else
            VERSION_DISPLAY="n/a (existing digest)"
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Phase 11 CD - deployment executed

          | Field | Value |
          |---|---|
          | Target environment | \`${TARGET_ENVIRONMENT}\` |
          | Mode | \`${DEPLOY_MODE}\` (publish-and-deploy or existing digest) |
          | Version | \`${VERSION_DISPLAY}\` |
          | Published image | \`${PUBLISHED_IMAGE:-n/a (digest deployment)}\` |
          | Deployed image | \`${DEPLOY_IMAGE}\` |
          | Digest (immutable identity) | \`${DEPLOY_DIGEST}\` |
          | Deploy | by digest via Podman (ADR-009); no rebuild for digest deployments |
          | Release control | immutable tag guard when publishing; environment \`${TARGET_ENVIRONMENT}\` restricted to \`main\` |
          | Smoke | \`GET /api/hello\` -> 200 \`Hello, World!\` |
          Run the deployed artifact with: \`podman run ... ${DEPLOY_IMAGE}\`
          EOF
