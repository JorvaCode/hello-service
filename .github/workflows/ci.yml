name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_version="8.30.1"
          gitleaks_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${gitleaks_sha256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP/gitleaks" -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --no-git \
            --report-format json --report-path gitleaks-report.json \
            --exit-code 1

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          version="$(./gradlew -q properties --console=plain | sed -n 's/^version: //p' | head -n1)"
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Resolved version: $version"

      - name: Build and test
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Build container image
        shell: bash
        run: |
          set -euo pipefail
          podman build \
            --build-arg APP_VERSION="${VERSION}" \
            --build-arg CI_REPOSITORY="${GITHUB_REPOSITORY}" \
            --build-arg CI_SHA="${GITHUB_SHA}" \
            -t "localhost/hello-service:${VERSION}" \
            -t "localhost/hello-service:${GITHUB_SHA}" .

      - name: Record artifact identity
        shell: bash
        run: |
          set -euo pipefail
          jar="build/libs/hello-service-${VERSION}.jar"
          test -f "$jar"
          jar_sha256="$(sha256sum "$jar" | awk '{print $1}')"
          image_id="$(podman inspect --format '{{.Id}}' "localhost/hello-service:${VERSION}")"
          jq -n \
            --arg version "$VERSION" \
            --arg sha "$GITHUB_SHA" \
            --arg jar_sha256 "$jar_sha256" \
            --arg image_id "$image_id" \
            '{version: $version, commit_sha: $sha, jar_sha256: $jar_sha256, image_id: $image_id}' \
            > artifact-metadata.json
          cat artifact-metadata.json

      - name: Upload artifact metadata
        uses: actions/upload-artifact@v4
        with:
          name: artifact-metadata
          path: artifact-metadata.json
          retention-days: 30

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-service-${{ env.VERSION }}
          path: build/libs/hello-service-${{ env.VERSION }}.jar
          retention-days: 30

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 30
