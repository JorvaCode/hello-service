name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Build container image
        shell: bash
        run: |
          set -euo pipefail
          podman build \
            --build-arg CI_REPOSITORY="${GITHUB_REPOSITORY}" \
            --build-arg CI_SHA="${GITHUB_SHA}" \
            -t "localhost/hello-service:${GITHUB_SHA}" .

      - name: Record artifact identity
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(podman inspect --format '{{.Id}}' "localhost/hello-service:${GITHUB_SHA}")"
          jq -n --arg sha "$GITHUB_SHA" --arg image_id "$image_id" \
            '{commit_sha: $sha, image_id: $image_id}' > artifact-metadata.json
          cat artifact-metadata.json

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-metadata
          path: artifact-metadata.json
          retention-days: 30
